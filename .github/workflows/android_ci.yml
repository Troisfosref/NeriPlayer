name: NeriPlayer Android CI

on:
  push:
    branches:
      - master
      - feat/qq-music
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Basic checks and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The trusted feature push already builds and signs the same revision.
    if: >-
      ${{ (github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]')) &&
          !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'feat/qq-music') }}
    env:
      # Never expose signing secrets to PR code, especially external forks.
      NERI_SIGNING_MODE: ${{ github.repository == 'Troisfosref/NeriPlayer' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/qq-music') && 'signed' || 'unsigned' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Prepare build identity
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          output = subprocess.check_output(
              ["python3", ".github/scripts/release_artifacts.py", "prepare"], text=True
          )
          values = dict(line.split("=", 1) for line in output.splitlines())
          properties = {
              "buildUuid": "build_uuid",
              "buildTimestamp": "build_timestamp",
              "buildVersionTimestamp": "build_version_timestamp",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for property_name, key in properties.items():
                  stream.write(f"ORG_GRADLE_PROJECT_{property_name}={values[key]}\n")
              for key, value in values.items():
                  stream.write(f"NERI_{key.upper()}={value}\n")

      - name: Check module boundaries
        run: python3 -B tools_pub/quality/module_boundaries.py

      - name: Test QQ Music and build Release
        run: |
          chmod +x gradlew
          ./gradlew :platform:testDebugUnitTest --tests 'moe.ouom.neriplayer.platform.qqmusic.*' \
            --tests 'moe.ouom.neriplayer.platform.search.api.codec.QQMusic*' \
            --tests 'moe.ouom.neriplayer.platform.search.api.client.QQMusicSearchApiTest' \
            --tests 'moe.ouom.neriplayer.platform.lyrics.repository.QQMusicLyricsRepositoryTest' \
            :lyrics:testDebugUnitTest --tests '*parser*' \
            :playback:logic:testDebugUnitTest --tests '*PlaybackQualityOwnerTest' \
            :app:testDebugUnitTest --tests '*SettingsAccountProfilesTest' --tests '*SettingsAccountProfileNormalizationTest' \
            --tests '*QQMusicSearchIntegrationTest' --tests '*QQMusicCollectionFavoritesTest' --tests '*ExploreScreenYouTubeGateTest' \
            --tests '*ExploreSearchPaginationTest' --tests '*ExploreSearchHistoryDisplayTest' --tests '*ExploreLinkRecognizerTest' \
            --tests '*QQMusicArtistDetailViewModelTest' --tests '*NeteaseArtistDetailContentTest' \
            --tests '*NeteaseArtistDetailViewModelLoadingTest' --tests '*NeteaseArtistDetailViewModelFollowTest' \
            :download:runtime:testDebugUnitTest --tests '*QQMusicDownloadLyricsTest' \
            :model:testDebugUnitTest --tests '*StorageUsageModelsTest' \
            :local:testDebugUnitTest --tests '*StorageUsageSummaryTest' --tests '*StorageUsageComponentsTest' --tests '*StorageUsageHostAdapterTest' \
            :app:assembleRelease -PallowUnsignedRelease=true --warning-mode all --stacktrace

      - name: Sign compiled APK (trusted branch only)
        if: env.NERI_SIGNING_MODE == 'signed'
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.NERI_QQ_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.NERI_QQ_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Configure NERI_QQ_KEYSTORE_BASE64 and NERI_QQ_KEYSTORE_PASSWORD in Actions Secrets."
            exit 1
          fi
          umask 077
          key_dir="$RUNNER_TEMP/neri-qqmusic-signing"
          mkdir -p "$key_dir"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$key_dir/neri-qqmusic.p12"
          keytool -list -storetype PKCS12 -keystore "$key_dir/neri-qqmusic.p12" \
            -storepass:env SIGNING_PASSWORD -alias neri-qqmusic >/dev/null
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          mapfile -d '' apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print0)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No compiled Release APK to sign."
            exit 1
          fi
          for index in "${!apks[@]}"; do
            apk="${apks[index]}"
            aligned="$RUNNER_TEMP/neri-qq-${index}-aligned.apk"
            signed="$RUNNER_TEMP/neri-qq-${index}-signed.apk"
            "$build_tools/zipalign" -f -p 4 "$apk" "$aligned"
            "$build_tools/apksigner" sign --ks "$key_dir/neri-qqmusic.p12" \
              --ks-type PKCS12 --ks-key-alias neri-qqmusic \
              --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
              --out "$signed" "$aligned"
            "$build_tools/apksigner" verify --verbose --print-certs "$signed"
            mv -f "$signed" "$apk"
            rm -f "$aligned"
          done

      - name: Remove transient signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/neri-qqmusic-signing"

      - name: Verify APK and build metadata
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 -B .github/scripts/release_artifacts.py stage \
            --apk-dir app/build/outputs/apk/release --output-dir build/release-artifacts
          (cd build/release-artifacts && sha256sum --check --strict SHA256SUMS.txt)
          python3 -B .github/scripts/release_artifacts.py summary \
            --metadata-file build/release-artifacts/build-metadata.json --status published \
            --expected-sha "$EXPECTED_SHA" --expected-build-uuid "$NERI_BUILD_UUID"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NERI_SIGNING_MODE == 'signed' && 'neri-apk-signed' || 'neri-apk-unsigned' }}
          path: build/release-artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload QQ Music test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qq-music-test-reports
          path: |
            modules/platform/build/test-results/testDebugUnitTest/**
            modules/platform/build/reports/tests/testDebugUnitTest/**
            modules/lyrics/build/test-results/testDebugUnitTest/**
            modules/playback/logic/build/test-results/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            modules/download/runtime/build/test-results/testDebugUnitTest/**
            modules/model/build/test-results/testDebugUnitTest/**
            modules/local/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore
