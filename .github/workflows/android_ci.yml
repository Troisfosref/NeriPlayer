name: NeriPlayer Android CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/labels.json'
      - '.github/scripts/issue_labels*'
      - '.github/scripts/sync_labels.cjs'
      - '.github/scripts/check_issue_forms.rb'
      - '.github/workflows/issue_labels.yml'
      - '.github/workflows/sync_labels.yml'
      - '.github/workflows/automation_checks.yml'
      - '.github/workflows/manual_release.yml'
      - '.github/workflows/recover_keystore.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.caching=true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Basic checks and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, '[skip ci]') }}
    env:
      NERI_SIGNING_MODE: unsigned
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Install Android NDK
        uses: ./.github/actions/android-ndk

      - name: Prepare build identity
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          output = subprocess.check_output(
              ["python3", ".github/scripts/release_artifacts.py", "prepare"], text=True
          )
          values = dict(line.split("=", 1) for line in output.splitlines())
          properties = {
              "buildUuid": "build_uuid",
              "buildTimestamp": "build_timestamp",
              "buildVersionTimestamp": "build_version_timestamp",
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for property_name, key in properties.items():
                  stream.write(f"ORG_GRADLE_PROJECT_{property_name}={values[key]}\n")
              for key, value in values.items():
                  stream.write(f"NERI_{key.upper()}={value}\n")

      - name: Check module boundaries
        run: python3 -B tools_pub/quality/module_boundaries.py

      - name: Test QQ Music and build Release
        run: |
          chmod +x gradlew
          ./gradlew :platform:testDebugUnitTest --tests 'moe.ouom.neriplayer.platform.qqmusic.*' \
            :app:assembleRelease -PallowUnsignedRelease=true --warning-mode all --stacktrace

      - name: Verify APK and build metadata
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 -B .github/scripts/release_artifacts.py stage \
            --apk-dir app/build/outputs/apk/release --output-dir build/release-artifacts
          (cd build/release-artifacts && sha256sum --check --strict SHA256SUMS.txt)
          python3 -B .github/scripts/release_artifacts.py summary \
            --metadata-file build/release-artifacts/build-metadata.json --status published \
            --expected-sha "$EXPECTED_SHA" --expected-build-uuid "$NERI_BUILD_UUID"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: neri-apk-unsigned
          path: build/release-artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload QQ Music test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qq-music-test-reports
          path: |
            modules/platform/build/test-results/testDebugUnitTest/**
            modules/platform/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
